<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g transform="translate(100, 110)">
    <!-- Badge -->
    <rect width="280" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#38bdf8" />
    <text x="42" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">PROCESAMIENTO PRIVADO LOCAL</text>

    <!-- Main Title -->
    <text x="0" y="120" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
      Image Converter PRO
    </text>

    <!-- Gradient Tagline -->
    <text x="0" y="190" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700">
      Conversor de Imágenes &amp; Herramientas IA
    </text>

    <!-- Description -->
    <text x="0" y="260" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      Convierte JPG, PNG, WebP, AVIF, TIFF, HEIC y SVG en tu navegador.
    </text>
    <text x="0" y="295" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      Elimina fondos con canal alfa transparente y mejora la calidad fotográfica con IA.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="160" height="44" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="80" y="27" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">100% Local</text>

      <rect x="180" y="0" width="180" height="44" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <text x="270" y="27" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Quitar Fondo IA</text>

      <rect x="380" y="0" width="160" height="44" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <text x="460" y="27" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Nano Banana</text>

      <rect x="560" y="0" width="180" height="44" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" />
      <text x="650" y="27" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Descarga ZIP</text>
    </g>
  </g>
</svg>
